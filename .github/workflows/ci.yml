name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift build and test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  waveform-coverage:
    name: Waveform 100% coverage gate
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Run Waveform coverage gate
        run: bash scripts/waveform-coverage.sh

  format:
    name: Format check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Install swift-format
        run: brew install swift-format

      - name: Lint formatting
        run: swift-format lint --recursive Package.swift packages/*/Sources packages/*/Tests

  ios-build:
    name: iOS generic build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Build for generic iOS destination
        run: |
          set -o pipefail
          xcodebuild -scheme WaveformUI \
            -destination 'generic/platform=iOS' \
            -quiet build
